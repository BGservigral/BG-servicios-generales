<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Redirigiendo a BG Servicios Generales...</title>
  <script>
    (function() {
      // Obtiene la raíz del repositorio de GitHub Pages
      var pathSegments = window.location.pathname.split('/');
      
      // Si tu repositorio está en un subdominio (ej: usuario.github.io/nombre-repo)
      var repoPath = pathSegments.length > 1 && pathSegments[1] ? '/' + pathSegments[1] + '/' : '/';
      
      // Reemplaza la URL rota enviando al usuario directamente al inicio limpio
      window.location.replace(window.location.origin + repoPath);
    })();
  </script>
</head>
<body style="background-color: #eef2f6; font-family: sans-serif; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; color: #0a1128;">
  <div style="text-align: center; padding: 20px;">
    <h2>Cargando BG Servicios Generales...</h2>
    <p>Te estamos redirigiendo a nuestra página principal.</p>
  </div>
</body>
</html>
